{% extends "console/base.html" %}
{% block title %}로그인 · 계정 보호 콘솔{% endblock %}
{% block body %}
<main class="center-wrap">
  <section class="card login-card">
    <div class="card-body">
      <h1>운영자 로그인</h1>
      <p class="lead">이 콘솔에서 실행한 조치는 로그인한 운영자 이름으로 기록됩니다.</p>
      {% if form.errors %}<p class="form-error" role="alert">아이디 또는 비밀번호가 올바르지 않습니다.</p>{% endif %}
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field">
          <label for="id_username">아이디</label>
          <input type="text" id="id_username" name="username" autocomplete="username" autocapitalize="none"
                 maxlength="150" required autofocus>
        </div>
        <div class="field">
          <label for="id_password">비밀번호</label>
          <input type="password" id="id_password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">로그인</button>
      </form>
    </div>
  </section>
</main>
{% endblock %}
